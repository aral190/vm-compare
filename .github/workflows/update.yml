name: Weekly VPS price update

on:
  schedule:
    # Mondays at 04:00 UTC = 06:00 SAST
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape provider prices
        run: npm run scrape

      - name: Validate data
        run: npm run validate

      - name: Commit changed prices
        run: |
          git config user.name "vm-compare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update VPS prices $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Build site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_UTM_SOURCE: ${{ vars.PUBLIC_UTM_SOURCE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
