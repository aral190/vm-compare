name: Agent PR

on:
  push:
    branches:
      - "zeroclaw/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate data
        run: npm run validate

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Build site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  open-pr:
    name: Open pull request
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')"
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Agent: ${BRANCH#zeroclaw/}" \
              --body "Automated change from ZeroClaw on \`$BRANCH\`. Validation run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "PR already open for $BRANCH"
          fi