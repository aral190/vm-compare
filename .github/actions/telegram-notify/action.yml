name: Telegram notify
description: Send a workflow status message to Telegram. No-op when the bot token or chat ID is unset.

inputs:
  bot_token:
    description: Telegram bot token (store as the TELEGRAM_BOT_TOKEN repository secret)
    required: false
    default: ""
  chat_id:
    description: Telegram chat ID (store as the TELEGRAM_CHAT_ID repository secret)
    required: false
    default: ""
  title:
    description: Human-readable name of the workflow or stage
    required: true
  status:
    description: Job or stage status (success, failure, cancelled or skipped)
    required: true
  details:
    description: Optional extra lines shown in the message (plain text)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Telegram message
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_ID: ${{ inputs.chat_id }}
        TITLE: ${{ inputs.title }}
        STATUS: ${{ inputs.status }}
        DETAILS: ${{ inputs.details }}
      run: |
        set -euo pipefail

        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; skipping notification."
          exit 0
        fi

        case "$STATUS" in
          success) icon="✅" ;;
          failure) icon="❌" ;;
          cancelled) icon="⚠️" ;;
          skipped) icon="⏭️" ;;
          *) icon="ℹ️" ;;
        esac

        escape_html() {
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
        }

        message_file="$(mktemp)"
        {
          printf '%s <b>%s</b>\n' "$icon" "$(printf '%s' "$TITLE" | escape_html)"
          printf '<b>Status:</b> %s\n' "$(printf '%s' "$STATUS" | escape_html)"
          printf '<b>Repo:</b> %s\n' "$(printf '%s' "$GITHUB_REPOSITORY" | escape_html)"
          printf '<b>Branch:</b> %s\n' "$(printf '%s' "${GITHUB_REF_NAME:-unknown}" | escape_html)"
          printf '<b>Commit:</b> <code>%s</code>\n' "$(printf '%s' "${GITHUB_SHA:0:7}" | escape_html)"
          if [ -n "$DETAILS" ]; then
            printf '%s\n' "$(printf '%s' "$DETAILS" | escape_html)"
          fi
          printf '<a href="%s/%s/actions/runs/%s">View run</a>\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
        } > "$message_file"

        payload=$(jq -n \
          --arg chat_id "$CHAT_ID" \
          --arg text "$(cat "$message_file")" \
          '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')
        rm -f "$message_file"

        response=$(curl --silent --show-error --fail-with-body \
          -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -H 'Content-Type: application/json' \
          --data "$payload") || {
          echo "::warning::Telegram notification failed: ${response:-no response}"
          exit 0
        }

        echo "Telegram notification sent."
